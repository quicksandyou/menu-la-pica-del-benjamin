<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS | La Picá del Benjamín</title><style>
:root{--g:#ffc34d;--o:#e97919}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#291707,#090807 65%);color:#fff;font:15px system-ui,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:800}.top{padding:16px 22px;background:#100b07;border-bottom:2px solid #a85b13;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:950;color:var(--g)}.sub{color:#cdb99e;font-size:12px}.wrap{max-width:1500px;margin:auto;padding:18px}.notice{background:#2b1a0d;border:1px solid #8b561f;border-radius:10px;padding:10px 14px;color:#f8dfb6;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}.tools{display:flex;gap:8px;margin-bottom:12px}.tools input{flex:1}input,select,textarea{width:100%;padding:11px;border:1px solid #6a5138;border-radius:9px;background:#f8f3eb;color:#21170f}.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 13px}.tabs button{white-space:nowrap;background:#24190f;color:#f7dfb7;border:1px solid #67451f}.tabs .active{background:var(--g);color:#241306}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}.product{background:linear-gradient(145deg,#24190f,#15110d);border:1px solid #5d3b1e;border-radius:12px;padding:13px;min-height:118px;display:flex;flex-direction:column;gap:8px}.product strong{color:var(--g)}.price{font-size:20px;font-weight:900}.add,.primary{background:linear-gradient(90deg,#ffd45c,#ed7817);color:#241306}.add{margin-top:auto}.cart{background:#f4efe7;color:#21170f;border-radius:14px;padding:16px;position:sticky;top:12px;height:max-content}.cartrow{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #d8caba;padding:9px 0;font-size:13px}.qty{display:flex;align-items:center;gap:7px}.qty button{padding:3px 9px;background:#33251a;color:#fff}.total{font-size:25px;font-weight:950;color:#9d4709;text-align:right;margin:14px 0}.action{width:100%;margin-top:8px;background:#2b2118;color:white}.field{margin:9px 0}.field label{display:block;font-size:12px;color:#594632;margin-bottom:4px}.muted{color:#6e6255;font-size:11px}.hidden{display:none!important}.login{max-width:380px;margin:12vh auto;background:#1b140e;border:1px solid #81501f;border-radius:16px;padding:26px;box-shadow:0 15px 50px #0009}.login h1{color:var(--g)}.login input{text-align:center;font-size:27px;letter-spacing:9px;margin:12px 0}.login button{width:100%}.receipt{display:none;color:#000;background:#fff;padding:20px}.receipt h2{text-align:center}.rline{display:flex;justify-content:space-between;border-bottom:1px dashed #999;padding:6px 0}.rtotal{font-size:20px;font-weight:bold;text-align:right;margin-top:14px}@media(max-width:900px){.layout{grid-template-columns:1fr}.cart{position:static;order:-1}}@media print{body{background:white;color:black}.top,.wrap,.login{display:none!important}.receipt{display:block!important;position:absolute;inset:0}}

.tabbar{display:flex;align-items:center;gap:6px;min-width:0;margin:2px 0 12px}
.tabs{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#b8792b #21170f;padding:7px 2px 12px;flex:1;min-width:0}
.tabs button{flex:0 0 auto;min-height:42px;padding:10px 15px}
.tab-arrow{flex:0 0 38px;width:38px;height:42px;padding:0;background:#3a2817;color:#ffd36b;border:1px solid #8b5a25;font-size:25px;line-height:1}
.tabs button:focus-visible,.tab-arrow:focus-visible,.add:focus-visible{outline:3px solid #ffe09a;outline-offset:2px}
@media(max-width:600px){.tab-arrow{flex-basis:32px;width:32px}.tabs button{padding:9px 12px;font-size:13px}}
</style></head><body><header class="top"><div><div class="brand">🍔 LA PICÁ DEL BENJAMÍN</div><div class="sub">Punto de venta local · Uso interno</div></div><button id="staffShortcut" onclick="document.getElementById('staffEmbedded').style.display='block'">🚴 Repartidor / Jefatura</button></header>

<main id="app" class="wrap"><div class="notice">POS local de acceso directo, sin contraseña. El historial permanente de ventas será incorporado en la siguiente etapa.</div><div class="layout"><section><div class="tools"><input id="search" placeholder="Buscar producto..." oninput="renderProducts()"><select id="mode"><option>Consumo en local</option><option>Retiro en el local</option></select></div><div class="tabbar"><button class="tab-arrow" id="catPrev" type="button" aria-label="Ver categorías anteriores">‹</button><nav class="tabs" id="tabs" aria-label="Categorías de productos"></nav><button class="tab-arrow" id="catNext" type="button" aria-label="Ver más categorías">›</button></div><div class="products" id="products"></div></section><aside class="cart"><h2>🧾 Pedido actual</h2><div id="cartLines">Agrega productos para comenzar.</div><div class="total" id="total">$0</div><div class="field"><label>Cliente (opcional)</label><input id="customer" placeholder="Nombre del cliente"></div><div class="field"><label>Forma de pago</label><select id="payment"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Pendiente</option></select></div><div class="field"><label>Observaciones para cocina</label><textarea id="notes" rows="2" placeholder="Sin cebolla, término, etc."></textarea></div><button class="action primary" onclick="printReceipt()">Imprimir comanda</button><button class="action" onclick="newOrder()">Nuevo pedido / limpiar</button><p class="muted">La impresión abre el diálogo de Windows.</p></aside></div></main><section id="receipt" class="receipt"></section>
<script>
const P=[
['Rolls','California Rolls',4700],['Rolls','Tempura o Panko',4900],['Rolls','Salmón',5500],['Rolls','Avocado',4900],['Rolls','Hosomaki',2350],['Rolls','Chicken (10 cortes)',5390],['Rolls','Fresh (10 cortes)',4990],['Rolls','Mechada Rolls (10 cortes)',5490],['Rolls','Tor Rolls (10 cortes)',5550],['Rolls','Nigiri (2 bocados)',3300],['Rolls','Sashimi 6 cortes',5200],['Rolls','Sashimi 9 cortes',6900],
['Ceviches','Ceviche camarón-salmón',7990],['Ceviches','Ceviche mixto',9490],['Gohan','Gohan a elección',5990],['Pizzas','Napolitana',7990],['Pizzas','Pollo champiñón',8990],['Pizzas','Cuatro estaciones',8990],['Pizzas','Peperoni',7990],['Pizzas','Especial carne',8990],['Pizzas','Mexicana',8990],['Pizzas','Mediterránea',9990],['Pizzas','Mechada choclo',8990],['Pizzas','Carnes mixtas',8990],
['Sándwiches','Clásico de la casa',4990],['Sándwiches','Chacarero',4990],['Sándwiches','Barros Luco',4990],['Sándwiches','Benjita',6490],['Sándwiches','Sándwich del chef',5990],['Sándwiches','A lo pobre',5990],['Sándwiches','Vegetariano',6490],['Sándwiches','Mexicano',5990],['Sándwiches','Chileno',5990],['Sándwiches','Cheese Cream',6890],['Sándwiches','Chicken',6990],
['Bebidas','Bebida lata 350 cc',1500],['Bebidas','Bebida botella 1,5 litros',2500],['Jugos naturales','Jugo natural 350 cc',2500],['Jugos naturales','Jugo natural 1 litro',3990],['Néctares','Néctar 1,5 litros',2500],['Aguas','Agua mineral 600 ml',1000],['Energéticas','Red Bull 250 cc',2500]];
const cats=['Todos',...new Set(P.map(p=>p[0]))];
let category='Todos',cart={};
const money=n=>'$'+Number(n||0).toLocaleString('es-CL');
function iniciarPOS(){
 renderTabs();renderProducts();drawCart();
 const tabs=document.getElementById('tabs');
 const products=document.getElementById('products');
 tabs.addEventListener('click',e=>{
   const btn=e.target.closest('button[data-category]');
   if(!btn)return;
   category=btn.dataset.category;
   renderTabs();renderProducts();
 });
 products.addEventListener('click',e=>{
   const btn=e.target.closest('button[data-add-index]');
   if(!btn)return;
   const product=P[Number(btn.dataset.addIndex)];
   if(!product)return;
   add(product[1]);
 });
 document.getElementById('cartLines').addEventListener('click',e=>{
   const btn=e.target.closest('button[data-change]');
   if(!btn)return;
   change(btn.dataset.name,Number(btn.dataset.change));
 });
 document.getElementById('catPrev').addEventListener('click',()=>tabs.scrollBy({left:-260,behavior:'smooth'}));
 document.getElementById('catNext').addEventListener('click',()=>tabs.scrollBy({left:260,behavior:'smooth'}));
}
function renderTabs(){
 const tabs=document.getElementById('tabs');
 tabs.innerHTML=cats.map(c=>'<button type="button" class="'+(c===category?'active':'')+'" data-category="'+c.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" aria-pressed="'+(c===category)+'">'+c+'</button>').join('');
}
function renderProducts(){
 const q=document.getElementById('search').value.trim().toLocaleLowerCase('es-CL');
 const list=P.map((p,index)=>({p,index})).filter(({p})=>(category==='Todos'||p[0]===category)&&p[1].toLocaleLowerCase('es-CL').includes(q));
 const products=document.getElementById('products');
 products.innerHTML=list.map(({p,index})=>'<article class="product"><strong>'+p[1]+'</strong><span class="sub">'+p[0]+'</span><span class="price">'+money(p[2])+'</span><button type="button" class="add" data-add-index="'+index+'">＋ Agregar</button></article>').join('');
 if(!list.length)products.innerHTML='<p class="muted">No hay productos en esta categoría.</p>';
}
function add(n){
 const product=P.find(p=>p[1]===n);
 if(!product)return;
 cart[n]=(cart[n]||0)+1;
 drawCart();
}
function change(n,d){
 if(!cart[n])return;
 cart[n]+=d;
 if(cart[n]<=0)delete cart[n];
 drawCart();
}
function drawCart(){
 let sum=0;
 const entries=Object.entries(cart);
 const lines=document.getElementById('cartLines');
 lines.innerHTML=entries.length?entries.map(([n,q])=>{
   const p=P.find(x=>x[1]===n);
   if(!p)return '';
   const lineTotal=Number(p[2])*Number(q);
   sum+=lineTotal;
   return '<div class="cartrow"><div><b>'+n+'</b><br>'+money(p[2])+' c/u</div><div class="qty"><button type="button" data-change="-1" data-name="'+n.replace(/"/g,'&quot;')+'" aria-label="Quitar uno">−</button>'+q+'<button type="button" data-change="1" data-name="'+n.replace(/"/g,'&quot;')+'" aria-label="Agregar uno">＋</button></div><b>'+money(lineTotal)+'</b></div>';
 }).join(''):'Agrega productos para comenzar.';
 document.getElementById('total').textContent=money(sum);
}
function newOrder(){
 if(!Object.keys(cart).length)return;
 if(!confirm('¿Limpiar el pedido actual?'))return;
 cart={};document.getElementById('customer').value='';document.getElementById('notes').value='';document.getElementById('payment').value='Efectivo';drawCart();
}
function printReceipt(){
 const entries=Object.entries(cart);
 if(!entries.length)return alert('Agrega al menos un producto.');
 let sum=0;
 const detail=entries.map(([n,q])=>{
   const p=P.find(x=>x[1]===n);
   if(!p)return '';
   const lineTotal=Number(p[2])*Number(q);sum+=lineTotal;
   return '<div class="rline"><span>'+q+' x '+n+'</span><b>'+money(lineTotal)+'</b></div>';
 }).join('');
 document.getElementById('receipt').innerHTML='<h2>LA PICÁ DEL BENJAMÍN</h2><p style="text-align:center">COMANDA DE COCINA / CAJA</p><p>Fecha: '+new Date().toLocaleString('es-CL')+'</p><p>Cliente: '+(document.getElementById('customer').value.trim()||'Sin nombre')+'</p><p>Modalidad: '+document.getElementById('mode').value+'</p><hr>'+detail+'<div class="rtotal">TOTAL: '+money(sum)+'</div><p>Pago: '+document.getElementById('payment').value+'</p><p>Observaciones: '+(document.getElementById('notes').value.trim()||'Sin observaciones')+'</p><hr><p style="text-align:center">¡Gracias por preferirnos!</p>';
 window.print();
}
iniciarPOS();
</script><section id="staffEmbedded" style="display:none;position:fixed;inset:0;background:#100b07;z-index:9999;padding:12px"><button onclick="document.getElementById('staffEmbedded').style.display='none'" style="padding:12px">Volver al POS</button><iframe src="https://menu-la-pica-del-benjamin.onrender.com/reparto.html" style="width:100%;height:calc(100% - 50px);border:0"></iframe></section><button id="staffShortcut" onclick="document.getElementById('staffEmbedded').style.display='block'" style="position:fixed;right:18px;top:18px;z-index:99;background:#ffc34d;padding:12px;border-radius:10px">🚴 Repartidor / Jefatura</button></body></html>
