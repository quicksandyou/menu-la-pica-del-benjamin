name: Construir APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - "icons/**"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "www/**"
      - "index.html"
      - "menu.json"
      - "assets/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Preparar Capacitor
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 sharp
          npx cap add android
          npx cap sync android
      - name: Aplicar icono oficial normal y adaptativo de Android
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const source = 'icons/La Picá del Benjamín_ Sabor a domicilio (1).png';
          if (!fs.existsSync(source)) throw new Error('No se encontró la imagen oficial: ' + source);
          const densities = { mdpi:1, hdpi:1.5, xhdpi:2, xxhdpi:3, xxxhdpi:4 };
          (async()=>{
            for (const [density,scale] of Object.entries(densities)) {
              const dir = path.join('android/app/src/main/res', 'mipmap-' + density);
              fs.mkdirSync(dir,{recursive:true});
              const size = Math.round(48*scale);
              await sharp(source).resize(size,size,{fit:'contain',background:'#080808'}).png().toFile(path.join(dir,'ic_launcher.png'));
              await sharp(source).resize(size,size,{fit:'contain',background:'#080808'}).png().toFile(path.join(dir,'ic_launcher_round.png'));
              const adaptiveSize = Math.round(108*scale);
              await sharp(source).resize({width:Math.round(adaptiveSize*0.78),height:Math.round(adaptiveSize*0.78),fit:'contain',background:{r:0,g:0,b:0,alpha:0}}).extend({top:Math.round(adaptiveSize*0.11),bottom:adaptiveSize-Math.round(adaptiveSize*0.89),left:Math.round(adaptiveSize*0.11),right:adaptiveSize-Math.round(adaptiveSize*0.89),background:{r:0,g:0,b:0,alpha:0}}).png().toFile(path.join(dir,'ic_launcher_foreground.png'));
            }
            const anydpi = path.join('android/app/src/main/res','mipmap-anydpi-v26');
            fs.mkdirSync(anydpi,{recursive:true});
            const adaptive = name => `<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/pica_launcher_background_v2"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n`;
            fs.writeFileSync(path.join(anydpi,'ic_launcher.xml'),adaptive());
            fs.writeFileSync(path.join(anydpi,'ic_launcher_round.xml'),adaptive());
            const values = path.join('android/app/src/main/res','values');
            fs.mkdirSync(values,{recursive:true});
            fs.writeFileSync(path.join(values,'pica_launcher_colors.xml'),'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="pica_launcher_background_v2">#080808</color>\n</resources>\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Construir APK de prueba
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: la-pica-del-benjamin-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
