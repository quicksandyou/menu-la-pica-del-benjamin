name: Construir APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "www/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Instalar paquetes del SDK Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Capacitor
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          npx cap add android
          npx cap sync android
      - name: Construir APK de prueba
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: la-pica-del-benjamin-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
