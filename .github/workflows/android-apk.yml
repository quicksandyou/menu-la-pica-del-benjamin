name: Construir APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - "icons/**"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
      - "www/**"
      - "index.html"
      - "menu.json"
      - "assets/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Preparar Capacitor
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 sharp
          npx cap add android
          npx cap sync android
      - name: Aplicar icono oficial de La Picá del Benjamín
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const source = 'icons/La Picá del Benjamín_ Sabor a domicilio (1).png';
          if (!fs.existsSync(source)) throw new Error('No se encontró la imagen oficial: ' + source);
          const sizes = { mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192 };
          (async()=>{
            for (const [density,size] of Object.entries(sizes)) {
              const dir = path.join('android/app/src/main/res', 'mipmap-' + density);
              fs.mkdirSync(dir,{recursive:true});
              const icon = sharp(source).resize(size,size,{fit:'contain',background:'#080808'}).png();
              await icon.toFile(path.join(dir,'ic_launcher.png'));
              await sharp(source).resize(size,size,{fit:'contain',background:'#080808'}).png().toFile(path.join(dir,'ic_launcher_round.png'));
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Construir APK de prueba
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: la-pica-del-benjamin-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
