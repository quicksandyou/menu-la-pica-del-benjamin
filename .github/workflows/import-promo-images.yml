name: Importar imágenes de promociones
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-promo-images.yml"
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Descargar fotografías originales adjuntas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/promos
          curl -fLsS --retry 3 --retry-delay 2 "$PROMO4" -o assets/promos/promo-4.jpg
          curl -fLsS --retry 3 --retry-delay 2 "$SUSHIBURGER" -o assets/promos/sushi-burger.jpg
          curl -fLsS --retry 3 --retry-delay 2 "$HANROLLS" -o assets/promos/3-hanrolls.jpg
          curl -fLsS --retry 3 --retry-delay 2 "$ITALIANO" -o assets/promos/promo-italiano-handroll.jpg
          curl -fLsS --retry 3 --retry-delay 2 "$SUSHIPIZZA" -o assets/promos/combo-sushi-pizza.jpg
          curl -fLsS --retry 3 --retry-delay 2 "$SUSHIMIX" -o assets/promos/promociones-sushi.jpg
          file assets/promos/*
          test "$(find assets/promos -type f | wc -l)" -eq 6
        env:
          PROMO4: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/e13e85ce-4388-48c9-b422-6f6ff23cd6a4.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDQzZWIyNWZmMDkyMGM0NiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQzMDY4N30.3ooXjviVGw2mDCUBsZ-oiC01qtG7PtflGcDkykC12LM"
          SUSHIBURGER: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/c20bd6b7-fcc7-4a9b-bf50-da54fa55db32.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjIyZGQzMzMzNjFlNjhjYSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDM5NTk1NX0.AE5iT6PXXEoKMH7PKRCWrw9F389kvCnxmwCCSgy5pmg"
          HANROLLS: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/d7b57f7c-1b77-40fb-bbd9-159f9fffa65c.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTg5Y2E5NTY0YmM2OTM1OCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQyMTA3OH0.9GchxCsQDRhDOIjEwEsW37wAm-Xl8Wgpqe9ic27oNd8"
          ITALIANO: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/4f5ae098-3359-4a05-8a3e-e06dfa2642e5.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODEyNDkwZWVjNjk4Mjg1YSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ0NjA2Mn0.jJ1bDO2m2mmxZ-pGWDQ4z_bPv5K7hx_0t774DhVN9P8"
          SUSHIPIZZA: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/e6909e20-c294-4e8e-96a0-d9ab7465eb57.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjNkNjBkNDJhNzE5MzFjNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ2NTk4Nn0.XvSx7QqiGVmKGWn0HOxeQNsy6LfBdj_t6Nb4pUynHM4"
          SUSHIMIX: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/bb3fb084-9468-4596-ab8c-a42acda13ec4.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWZlNzRiMjI2ZDM3OWIwZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ0NzY1MH0.n2yOBRy7bcF-hCRgqNCju0t109iap5ZwMojuuZMmz7o"
      - name: Guardar imágenes permanentemente en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/promos
          git commit -m "Agregar fotografías de promociones y sushi burger"
          git push origin HEAD:main
