name: Build Windows desktop installer
on:
  push:
    branches: [main]
    tags:
      - "desktop-v*"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate master menu
        run: node scripts/validate-menu.js
      - name: Assign unique desktop version
        working-directory: desktop
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Generate 256px Windows icon from uploaded golden emblem
        working-directory: desktop
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          @'
          from PIL import Image
          source = Image.open("build/icon.ico.ico").convert("RGBA")
          source = source.resize((256, 256), Image.Resampling.LANCZOS)
          source.save("build/icon.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          check = Image.open("build/icon.ico")
          if check.size[0] < 256 or check.size[1] < 256:
              raise SystemExit("El icono generado no alcanza 256x256")
          print("Icono Windows generado:", check.size)
          '@ | python -
      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never
      - name: Upload installer for testing
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: LaPicaDelBenjamin-Windows-Installer
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
      - name: Publish automatic update release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          target_commitish: main
          name: La Picá del Benjamín v${{ github.run_number }}
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tagged installer release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
