name: Build Windows desktop installer
on:
  push:
    branches: [main]
    tags:
      - "desktop-v*"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate master menu
        run: node scripts/validate-menu.js
      - name: Assign unique desktop version
        working-directory: desktop
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Use uploaded golden emblem icon
        working-directory: desktop
        shell: pwsh
        run: |
          if (!(Test-Path "build/icon.ico.ico")) { throw "No se encontró desktop/build/icon.ico.ico" }
          Copy-Item "build/icon.ico.ico" "build/icon.ico" -Force
      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never
      - name: Upload installer for testing
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: LaPicaDelBenjamin-Windows-Installer
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
      - name: Publish automatic update release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          target_commitish: main
          name: La Picá del Benjamín v${{ github.run_number }}
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tagged installer release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
