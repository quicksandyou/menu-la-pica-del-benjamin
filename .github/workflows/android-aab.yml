
name: Generar AAB firmado - La Picá del Benjamín

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar paquetes Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar Capacitor
        run: |
          npm install --no-save --no-package-lock @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Preparar proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configurar número de versión para Google Play
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s, count_code = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+',
              r'\g<1>2',
              s,
              count=1
          )

          s, count_name = re.subn(
              r"""(?m)^(\s*versionName\s+)(['"])[^'"]+\2""",
              r'\g<1>"1.1"',
              s,
              count=1
          )

          if count_code != 1 or count_name != 1:
              raise SystemExit("No se pudo configurar versionCode y versionName")

          p.write_text(s)
          print("Versión configurada: 2 (1.1)")
          PY

      - name: Configurar SDK Android para Google Play
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          if not p.exists():
              raise SystemExit("No existe android/variables.gradle")

          s = p.read_text()

          values = {
              "minSdkVersion": 24,
              "compileSdkVersion": 36,
              "targetSdkVersion": 36
          }

          for key, value in values.items():
              pattern = rf'(?m)^(\s*{key}\s*=\s*)\d+'
              s, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + str(value),
                  s,
                  count=1
              )

              if count != 1:
                  raise SystemExit(f"No se encontró {key} en variables.gradle")

          p.write_text(s)

          print("SDK mínimo: 24")
          print("SDK compilación: 36")
          print("SDK destino: 36")
          PY

      - name: Recuperar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks"
          test -s "$GITHUB_WORKSPACE/upload-keystore.jks"

      - name: Configurar firma Release
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("GITHUB_WORKSPACE") + "/upload-keystore.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {" + signing, 1)

          pattern = r"(buildTypes\s*\{\s*release\s*\{)"

          s, count = re.subn(
              pattern,
              r"\1\n            signingConfig signingConfigs.release",
              s,
              count=1
          )

          if count != 1:
              raise SystemExit("No se encontró la configuración Release de Gradle")

          p.write_text(s)
          PY

      - name: Verificar clave y alias
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Generar AAB firmado
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace --info

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: La-Pica-del-Benjamin-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
