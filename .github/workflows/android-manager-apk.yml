name: Construir APK única de La Picá del Benjamín
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-manager-apk.yml"
      - "icons/**"
      - "reparto.html"
      - "personal.html"
      - "server.js"
      - "reparto-manifest.json"
      - "sw.js"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Preparar Capacitor para todos los perfiles
        run: |
          mkdir -p www
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "cl.benjamin.picada",
            "appName": "La Picá del Benjamín",
            "webDir": "www",
            "server": {
              "url": "https://menu-la-pica-del-benjamin.onrender.com/reparto.html",
              "cleartext": false,
              "allowNavigation": [
                "menu-la-pica-del-benjamin.onrender.com",
                "menu-la-pica-del-benjamin-pago.onrender.com",
                "www.google.com",
                "wa.me"
              ]
            }
          }
          EOF
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/app-launcher@^7 sharp
          npx cap add android
          npx cap sync android
      - name: Habilitar apertura de aplicaciones bancarias instaladas
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if '<queries>' not in s:
              q = """    <queries>
                  <package android:name="net.veritran.becl.prod" />
                  <package android:name="cl.bci.app.personas" />
              </queries>
          """
              s = s.replace('<application', q + '    <application', 1)
              p.write_text(s)
          PY
      - name: Aplicar icono 3D de la aplicación Android
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const svg = fs.readFileSync('icons/icon.svg');
          const sizes = { mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192 };
          (async()=>{
            for (const [density,size] of Object.entries(sizes)) {
              const dir = path.join('android/app/src/main/res', 'mipmap-' + density);
              fs.mkdirSync(dir,{recursive:true});
              await sharp(svg).resize(size,size).png().toFile(path.join(dir,'ic_launcher.png'));
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Construir APK de la jefa
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: la-pica-app-unica-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
