name: Construir APK de la jefa
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-manager-apk.yml"
      - "reparto.html"
      - "reparto-manifest.json"
      - "sw.js"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Preparar Capacitor para la jefa
        run: |
          mkdir -p www
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "cl.benjamin.picada.jefa",
            "appName": "La Pica - Pedidos",
            "webDir": "www",
            "server": {
              "url": "https://menu-la-pica-del-benjamin.onrender.com/reparto.html",
              "cleartext": false,
              "allowNavigation": [
                "menu-la-pica-del-benjamin.onrender.com",
                "menu-la-pica-del-benjamin-pago.onrender.com",
                "www.google.com",
                "wa.me"
              ]
            }
          }
          EOF
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          npx cap add android
          npx cap sync android
      - name: Construir APK de la jefa
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: la-pica-app-jefa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
