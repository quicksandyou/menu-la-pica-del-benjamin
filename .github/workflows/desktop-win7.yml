name: Build Windows 7 compatible POS
on:
  push:
    branches: [compat-windows7]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-win7.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows7:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat-windows7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate master menu
        run: node scripts/validate-menu.js
      - name: Install legacy desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Verify legacy runtime versions
        working-directory: desktop
        run: |
          node -e "console.log('Electron target:', require('./node_modules/electron/package.json').version)"
          node -e "console.log('Builder:', require('./node_modules/electron-builder/package.json').version)"
      - name: Generate Windows icon
        working-directory: desktop
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          @'
          from PIL import Image
          source = Image.open("build/icon.ico.ico.ico").convert("RGBA")
          source = source.resize((256, 256), Image.Resampling.LANCZOS)
          source.save("build/icon.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          check = Image.open("build/icon.ico")
          if check.size[0] < 256 or check.size[1] < 256:
              raise SystemExit("El icono generado no alcanza 256x256")
          print("Icono Windows generado:", check.size)
          '@ | python -
      - name: Build Windows 7 x64 installer
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload installer for Windows 7 testing
        uses: actions/upload-artifact@v4
        with:
          name: LaPicaDelBenjamin-Windows7-x64-1.1.156
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
