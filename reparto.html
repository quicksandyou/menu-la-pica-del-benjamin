<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b07"><title>Reparto | La Picá del Benjamín</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100b07;color:#fff;font:15px system-ui;padding:18px}.wrap{max-width:900px;margin:auto}h1{color:#ffc34b}.card{background:#21180f;border:1px solid #68451f;border-radius:14px;padding:16px;margin:12px 0}.muted{color:#c9b99f}.btn{padding:11px 14px;border:0;border-radius:9px;background:#f4a623;font-weight:800;margin:5px 5px 5px 0;cursor:pointer}.secondary{background:#463321;color:white}select{padding:10px;background:#100b07;color:white;border:1px solid #8c632f;border-radius:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{background:#35291d;padding:10px;border-radius:8px;margin-top:8px}.hidden{display:none}
</style></head><body><main class="wrap"><h1>La Picá del Benjamín · Reparto</h1><div class="row"><span id="identity" class="muted"></span><button class="btn secondary" id="refresh">Actualizar</button><button class="btn secondary" id="logout">Cerrar sesión</button></div><section id="manual" class="card hidden"><h2>Registrar pedido manual</h2><div class="row"><input id="mName" placeholder="Nombre cliente"><input id="mPhone" placeholder="Teléfono"><input id="mTotal" type="number" placeholder="Total CLP"></div><div class="row"><select id="mSource"><option value="cash">Efectivo</option><option value="whatsapp">WhatsApp manual</option><option value="in_person">Presencial</option></select><select id="mMethod"><option>Delivery</option><option>Retiro en el local</option></select><select id="mZone"><option value="normal">Reparto normal $2.000</option><option value="far">Reparto lejano $3.000</option></select></div><div class="row"><input id="mAddress" placeholder="Dirección"><input id="mLocality" placeholder="Localidad"></div><textarea id="mNotes" placeholder="Detalle / observaciones" style="width:100%;min-height:65px;background:#100b07;color:white;margin-top:8px"></textarea><button class="btn" id="saveManual">Guardar pedido</button></section><section id="assign" class="card hidden"><h2>Asignar pedidos</h2><p class="muted">Selecciona un pedido y un repartidor.</p><div id="adminOrders"></div></section><section id="extrasBox" class="card"><h2>Carreras extra</h2><div id="extraForm" class="hidden"><input id="extraDesc" placeholder="Qué hay que hacer"><input id="extraDest" placeholder="Destino"><input id="extraAmount" type="number" placeholder="Monto solicitado CLP"><button class="btn" id="saveExtra">Solicitar carrera</button></div><div id="extras"></div></section><section class="card"><h2>Cierre de turno</h2><button class="btn" id="closeCsv">Descargar Excel compatible (CSV)</button><div id="totals"></div></section><h2>Pedidos</h2><div id="orders"></div><div id="message" class="status">Cargando…</div></main>
<script>
const API="https://menu-la-pica-del-benjamin-pago.onrender.com", $=id=>document.getElementById(id);
async function call(path,body){const r=await fetch(API+path,{method:body?"POST":"GET",credentials:"include",headers:{"Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function mapLink(o){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([o.delivery_address,o.locality,"Chile"].filter(Boolean).join(", "))}
async function load(){try{const d=await call("/api/reparto/pedidos");$("identity").textContent=d.role==="admin"?"Administración":"Repartidor";$("manual").classList.toggle("hidden",d.role!=="admin");$("extraForm").classList.toggle("hidden",d.role!=="driver");$("orders").replaceChildren();$("adminOrders").replaceChildren();$("assign").classList.toggle("hidden",d.role!=="admin");if(!d.orders.length){$("orders").append(el("div","card","No hay pedidos registrados en la base de datos todavía."));}
for(const o of d.orders){const card=el("article","card");card.append(el("h3","",o.order_number||("Pedido #"+o.id)));card.append(el("p","",o.customer_name||"Cliente"));card.append(el("p","muted",[o.delivery_address,o.locality].filter(Boolean).join(", ")||o.delivery_method||"Sin dirección"));card.append(el("p","muted","Estado: "+(o.delivery_status||"pendiente")+" · Pago: "+(o.payment_status||"pendiente")));if(o.driver_name)card.append(el("p","muted","Repartidor: "+o.driver_name));if(o.delivery_address){const a=el("a","btn","Abrir Google Maps");a.href=mapLink(o);a.target="_blank";a.rel="noopener";card.append(a)}
if(d.role==="driver"||d.role==="admin"){if(o.assignment_status==="assigned"){const b=el("button","btn","Confirmar retiro");b.onclick=()=>change(o.id,"picked_up");card.append(b)}if(o.assignment_status==="picked_up"){const b=el("button","btn","Marcar entregado");b.onclick=()=>change(o.id,"delivered");card.append(b)}}
$("orders").append(card);
if(d.role==="admin"){const line=el("div","row");line.append(el("span","",o.order_number||("#"+o.id)));const sel=el("select");for(const [v,t] of [["maximo","Máximo Palma"],["claudio","Claudio Scheid"]]){const op=el("option","",t);op.value=v;sel.append(op)}const b=el("button","btn","Asignar");b.onclick=async()=>{try{await call("/api/reparto/asignar",{order_id:o.id,driver_username:sel.value});$("message").textContent="Pedido asignado.";load()}catch(e){$("message").textContent=e.message}};line.append(sel,b);$("adminOrders").append(line)}}

const extraData=await call("/api/reparto/extras");
$("extras").replaceChildren();
for(const x of extraData.extras){const row=el("div","status",x.description+" · "+(x.destination||"")+" · $"+(x.requested_amount_clp||0)+" · "+x.approval_status+(x.driver_name?" · "+x.driver_name:""));if(d.role==="admin"&&x.approval_status==="pending"){const ok=el("button","btn","Aprobar");ok.onclick=async()=>{const v=prompt("Monto a pagar al repartidor",String(x.requested_amount_clp));if(v===null)return;await call("/api/reparto/extras/aprobar",{id:x.id,approved:true,amount:Number(v)});load()};const no=el("button","btn secondary","Rechazar");no.onclick=async()=>{await call("/api/reparto/extras/aprobar",{id:x.id,approved:false,amount:0});load()};row.append(ok,no)}$("extras").append(row)}
const closing=await call("/api/reparto/cierre");
$("totals").textContent=closing.totals.map(x=>x.display_name+": $"+x.delivery_total).join(" · ")||"Sin entregas cerradas todavía.";
window.closingData=closing;
$("message").textContent="Pedidos actualizados."; }catch(e){$("message").textContent=e.message}}
async function change(id,status){try{await call("/api/reparto/estado",{order_id:id,status});$("message").textContent="Estado actualizado.";load()}catch(e){$("message").textContent=e.message}}
$("saveManual").onclick=async()=>{try{const d=await call("/api/reparto/orden-manual",{customer_name:$("mName").value,customer_phone:$("mPhone").value,total_clp:Number($("mTotal").value),source:$("mSource").value,delivery_method:$("mMethod").value,delivery_zone:$("mZone").value,delivery_address:$("mAddress").value,locality:$("mLocality").value,notes:$("mNotes").value});$("message").textContent="Pedido registrado: "+d.order_number+" · pago al repartidor $"+d.driver_fee_clp;load()}catch(e){$("message").textContent=e.message}};
$("saveExtra").onclick=async()=>{try{await call("/api/reparto/extras",{description:$("extraDesc").value,destination:$("extraDest").value,amount:Number($("extraAmount").value)});$("message").textContent="Carrera enviada a aprobación.";load()}catch(e){$("message").textContent=e.message}};
$("closeCsv").onclick=async()=>{try{const d=await call("/api/reparto/cierre");const rows=[["Pedido","Fecha","Dirección","Localidad","Repartidor","Tipo","Pago repartidor","Estado"],...d.deliveries.map(x=>[x.order_number,x.created_at,x.delivery_address,x.locality,x.driver_name,x.delivery_zone,x.driver_fee_clp,x.delivery_status]),[],["Carrera extra","Destino","Solicitado","Aprobado","Estado","Repartidor"],...d.extras.map(x=>[x.description,x.destination,x.requested_amount_clp,x.approved_amount_clp,x.approval_status,x.driver_name]),[],["Totales por repartidor"],...d.totals.map(x=>[x.display_name,x.delivery_total])];const csv="\\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(";")).join("\\r\\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="cierre-turno-la-pica.csv";a.click();URL.revokeObjectURL(a.href)}catch(e){$("message").textContent=e.message}};
$("refresh").onclick=load;$("logout").onclick=async()=>{try{await call("/api/personal/logout",{})}finally{location.href="/personal.html"}};load();
</script></body></html>
