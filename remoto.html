<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos remotos · La Picá del Benjamín</title>
<meta name="theme-color" content="#171717">
<style>
:root{color-scheme:dark;--bg:#121212;--panel:#1f1f1f;--line:#393939;--gold:#ffc34d;--orange:#e97919;--text:#f7f3ec;--muted:#bdb4a7;--green:#48d26b;--red:#ff6c6c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38200e,#111 65%);font:15px system-ui,Arial;color:var(--text);padding:18px}.wrap{max-width:620px;margin:0 auto}.brand{display:flex;align-items:center;gap:12px;margin:8px 0 18px}.logo{font-size:34px}.brand h1{font-size:21px;line-height:1.1;margin:0;color:var(--gold)}.brand p{margin:4px 0;color:var(--muted);font-size:12px;letter-spacing:1px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #0004}.title{font-size:18px;font-weight:900;margin:0 0 12px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #565656;border-radius:10px;padding:13px;background:#141414;color:#fff;font:inherit;outline:none}.field input:focus,.field textarea:focus{border:2px solid var(--orange)}textarea{resize:vertical;min-height:94px}.total{display:flex;align-items:center;gap:8px;background:#e5f5df;border-radius:12px;padding:10px;color:#1a481b}.total strong{font-size:17px}.total input{flex:1;min-width:0;background:white;border:2px solid #e7a52b;border-radius:9px;padding:11px;color:#222;font-size:21px;font-weight:900}.btn{width:100%;border:0;border-radius:11px;padding:14px 12px;font:inherit;font-weight:900;margin-top:8px;cursor:pointer;background:linear-gradient(90deg,var(--gold),var(--orange));color:#271705}.btn.secondary{background:#333;color:white}.btn:disabled{opacity:.5;cursor:wait}.status{padding:12px;border-radius:10px;background:#262626;color:#ddd;font-size:14px;white-space:pre-wrap}.status.ok{border:1px solid #2e8a4a;color:#8ff0a8}.status.err{border:1px solid #a34a4a;color:#ffb5b5}.small{color:var(--muted);font-size:12px;line-height:1.5}.hidden{display:none!important}
</style></head><body><div class="wrap">
<header class="brand"><div class="logo">🍔</div><div><h1>La Picá del Benjamín</h1><p>PEDIDO REMOTO · IMPRESIÓN EN EL LOCAL</p></div></header>
<section id="loginPanel" class="panel"><h2 class="title">🔐 Acceso de personal</h2><div class="field"><label>Usuario</label><input id="username" autocomplete="username" placeholder="Usuario de personal"></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña"></div><button class="btn" id="loginBtn" onclick="login()">Ingresar</button><div id="loginStatus" class="status hidden"></div><p class="small">Acceso limitado a administrador y jefatura.</p></section>
<section id="orderPanel" class="panel hidden"><h2 class="title">✍️ Crear pedido manual</h2><div id="welcome" class="small"></div>
<div class="field"><label>Pedido (qué va a llevar)</label><textarea id="order" placeholder="Ej. 2 completos italianos, 1 papas fritas, 2 bebidas" maxlength="3000"></textarea></div>
<div class="field"><label>Teléfono</label><input id="phone" inputmode="tel" placeholder="+56 9 1234 5678" maxlength="30"></div>
<div class="field"><label>Nombre</label><input id="name" placeholder="Nombre del cliente" maxlength="120"></div>
<div class="field"><label>Dirección</label><textarea id="address" rows="2" placeholder="Dirección y referencia" maxlength="500"></textarea></div>
<div class="field"><label class="total"><strong>Total $</strong><input id="total" type="number" min="0" max="1000000" step="1" inputmode="numeric" placeholder="Escribe el total"></label></div>
<div class="field"><label>Observaciones para cocina</label><textarea id="notes" rows="2" placeholder="Sin cebolla, salsas, etc." maxlength="1000"></textarea></div>
<button class="btn" id="sendBtn" onclick="sendOrder()">📨 Enviar e imprimir en el local</button><button class="btn secondary" onclick="logout()">Cerrar sesión</button><div id="sendStatus" class="status hidden"></div>
</section></div>
<script>
const API="";
function statusBox(id,text,kind){const el=document.getElementById(id);el.textContent=text;el.className="status "+(kind||"");el.classList.remove("hidden");}
async function api(path,opts={}){const res=await fetch(API+path,{...opts,credentials:"include",headers:{"Accept":"application/json","Content-Type":"application/json",...(opts.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||"HTTP "+res.status);return data;}
function setLoggedIn(user){document.getElementById("loginPanel").classList.add("hidden");document.getElementById("orderPanel").classList.remove("hidden");document.getElementById("welcome").textContent="Sesión: "+user.full_name+" · "+user.role;}
async function login(){const btn=document.getElementById("loginBtn");btn.disabled=true;try{const d=await api("/api/personal/login",{method:"POST",body:JSON.stringify({username:document.getElementById("username").value.trim(),password:document.getElementById("password").value})});if(!["superadmin","manager"].includes(d.user?.role)){await api("/api/personal/logout",{method:"POST"});throw new Error("Esta cuenta no tiene permisos para pedidos remotos.");}if(d.mustChangePassword){throw new Error("Debes cambiar tu contraseña desde el portal de personal antes de usar el acceso remoto.");}setLoggedIn(d.user);statusBox("sendStatus","Sesión iniciada. El POS del local recibirá pedidos cuando esté conectado.","ok");}catch(e){statusBox("loginStatus",e.message,"err");}finally{btn.disabled=false;}}
async function checkSession(){try{const d=await api("/api/personal/me",{headers:{}});if(["superadmin","manager"].includes(d.user?.role))setLoggedIn(d.user);}catch(_){}}
async function sendOrder(){const btn=document.getElementById("sendBtn");btn.disabled=true;try{const d=await api("/api/remoto/pedidos",{method:"POST",body:JSON.stringify({order:document.getElementById("order").value,phone:document.getElementById("phone").value,name:document.getElementById("name").value,address:document.getElementById("address").value,total_clp:document.getElementById("total").value,notes:document.getElementById("notes").value})});statusBox("sendStatus","Pedido #"+d.job_id+" enviado. El POS del local lo recibirá e imprimirá al estar conectado.","ok");["order","phone","name","address","total","notes"].forEach(id=>document.getElementById(id).value="");document.getElementById("order").focus();}catch(e){statusBox("sendStatus",e.message,"err");}finally{btn.disabled=false;}}
async function logout(){try{await api("/api/personal/logout",{method:"POST"});}catch(_){}document.getElementById("orderPanel").classList.add("hidden");document.getElementById("loginPanel").classList.remove("hidden");document.getElementById("password").value="";}
checkSession();
</script></body></html>
